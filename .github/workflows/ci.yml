# Minimal CI for personal / single-host StockApp V12.
# Gate: unit subset + import boundary strictness (no GPU, no live Redis).
name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-and-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Keep lean: only what unit subset imports at collection time
          # python-dotenv: root conftest.py load_dotenv
          pip install pytest pandas pyyaml pydantic loguru redis python-dotenv

      - name: Import boundary checker (strict)
        run: python scripts/check_import_boundaries.py --root . --strict

      - name: Unit subset (no Redis / no GPU)
        env:
          # Include repo root (.) so `from scripts.*` matches NUC cron contract
          PYTHONPATH: src:scripts:.
        run: |
          pytest -q --tb=line \
            tests/test_phase5_bootstrap.py \
            tests/test_phase4_legacy_cage.py \
            tests/test_phase3_stores.py \
            tests/test_phase2_schema_dtos.py \
            tests/test_import_boundaries.py \
            tests/test_clock_port.py \
            tests/test_broker_port.py \
            tests/test_wiring.py \
            tests/test_chronos_backend_protocol.py \
            tests/test_market_data_client_protocol.py \
            tests/test_cron_pythonpath_contract.py \
            tests/test_live_guard.py \
            tests/test_paper_entry_wiring.py \
            tests/test_entry_orchestrator.py \
            tests/test_p0_3_entry_window.py \
            tests/test_p1_1_atomic_entry_guard.py \
            tests/test_halt_gate.py \
            tests/test_sizing_no_confidence_in_core.py \
            tests/test_p1_9_red_line_rules.py
