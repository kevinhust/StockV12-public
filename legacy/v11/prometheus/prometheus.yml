global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'stockapp'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['shadow_runner:8000']

  - job_name: 'pattern_scanner'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['v8_pattern_scanner:8000']

  - job_name: 'telegram_bot'
    static_configs:
      - targets: ['host.docker.internal:8003']
